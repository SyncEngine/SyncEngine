'An authentication exception occurred.': 'Προέκυψε ένα εξαιρετικό σφάλμα πιστοποίησης.'
'Authentication credentials could not be found.': 'Δεν βρέθηκαν διαπιστευτήρια πιστοποίησης.'
'Authentication request could not be processed due to a system problem.': 'Το αίτημα πιστοποίησης δεν μπορούσε να επεξεργαστεί λόγω προβλήματος συστήματος.'
'Invalid credentials.': 'Μη έγκυρα διαπιστευτήρια.'
'Cookie has already been used by someone else.': 'Το cookie έχει ήδη χρησιμοποιηθεί από κάποιον άλλο.'
'Not privileged to request the resource.': 'Δεν δικαιούστε να ζητήσετε την πόρο.'
'Invalid CSRF token.': 'Μη έγκυρο token CSRF.'
'No authentication provider found to support the authentication token.': 'Δεν βρέθηκε πάροχος πιστοποίησης που να υποστηρίζει το token πιστοποίησης.'
'No session available, it either timed out or cookies are not enabled.': 'Δεν υπάρχει διαθέσιμη συνεδρία, είτε έληξε είτε τα cookies δεν είναι ενεργοποιημένα.'
'No token could be found.': 'Δεν βρέθηκε κανένα token.'
'Username could not be found.': 'Το όνομα χρήστη δεν βρέθηκε.'
'Account has expired.': 'Ο λογαριασμός έχει λήξει.'
'Credentials have expired.': 'Τα διαπιστευτήρια έχουν λήξει.'
'Account is disabled.': 'Ο λογαριασμός είναι απενεργοποιημένος.'
'Account is locked.': 'Ο λογαριασμός είναι κλειδωμένος.'
'Too many failed login attempts, please try again later.': 'Πολλές αποτυχημένες προσπάθειες σύνδεσης, παρακαλώ δοκιμάστε ξανά αργότερα.'
'Invalid or expired login link.': 'Μη έγκυρος ή ληγμένος σύνδεσμος σύνδεσης.'
'Too many failed login attempts, please try again in %minutes% minute.': 'Πολλές αποτυχημένες προσπάθειες σύνδεσης, παρακαλώ δοκιμάστε ξανά σε %minutes% λεπτό.'
'Too many failed login attempts, please try again in %minutes% minutes.': 'Πολλές αποτυχημένες προσπάθειες σύνδεσης, παρακαλώ δοκιμάστε ξανά σε %minutes% λεπτά.'
