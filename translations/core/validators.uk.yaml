'The video is square ({{ width }}x{{ height }}px). Square videos are not allowed.': "Відео квадратне ({{ width }}x{{ height }}px). Квадратні відео не дозволені."
'The video is landscape oriented ({{ width }}x{{ height }}px). Landscape oriented videos are not allowed.': "Відео орієнтоване горизонтально ({{ width }}x{{ height }}px). Горизонтальне орієнтування відео не дозволене."
'The video is portrait oriented ({{ width }}x{{ height }}px). Portrait oriented videos are not allowed.': "Відео орієнтоване вертикально ({{ width }}x{{ height }}px). Вертикальне орієнтування відео не дозволене."
'The video file is corrupted.': "Файл відео пошкоджено."
'The video contains multiple streams. Only one stream is allowed.': "Відео містить кілька потоків. Дозволений лише один потік."
'Unsupported video codec "{{ codec }}".': "Непідтримуваний відеокодек ({{ codec }})."
'Unsupported video container "{{ container }}".': "Непідтримуваний відеоформат ({{ container }})."
'The image file is corrupted.': "Файл зображення пошкоджено."
'The image has too few pixels ({{ pixels }} pixels). Minimum amount expected is {{ min_pixels }} pixels.': "Зображення має замало пікселів ({{ pixels }} пікселів). Мінімальна кількість — {{ min_pixels }} пікселів."
'The image has too many pixels ({{ pixels }} pixels). Maximum amount expected is {{ max_pixels }} pixels.': "Зображення має забагато пікселів ({{ pixels }} пікселів). Максимальна кількість — {{ max_pixels }} пікселів."
'This filename does not match the expected charset.': "Це ім'я файлу не відповідає очікуваній кодуванні."
'This value is not valid XML.': "Це значення не є дійсним XML."
'This value does not conform to the expected XSD schema.': "Це значення не відповідає очікуваній XSD-схемі."
'This XML payload is too large ({{ size }} bytes): it exceeds the limit of {{ limit }} bytes.': "Цей XML-посилання занадто велике ({{ size }} байт): воно перевищує ліміт {{ limit }} байт."
'This value is not a valid cron expression.': "Це значення не є дійсним cron-виразом."
'The referenced entity does not exist.': "Реферована сутність не існує."
'This is not a valid ULID.': "Це не дійсний ULID."
'Please enter a valid UUID.': "Будь ласка, введіть дійсний UUID."
'Unable to find a suitable node provider': "Неможливо знайти відповідного постачальника вузла"
'You should agree to our license terms.': "Ви повинні погодитися з нашими ліцензійними умовами."
