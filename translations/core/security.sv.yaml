'An authentication exception occurred.': 'Ett autentiseringsfel inträffade.'
'Authentication credentials could not be found.': 'Autentiseringsuppgifter kunde inte hittas.'
'Authentication request could not be processed due to a system problem.': 'Autentiseringsförfrågan kunde inte bearbetas på grund av ett systemproblem.'
'Invalid credentials.': 'Ogiltiga inloggningsuppgifter.'
'Cookie has already been used by someone else.': 'Cookiën har redan använts av någon annan.'
'Not privileged to request the resource.': 'Inte behörig att begära resursen.'
'Invalid CSRF token.': 'Ogiltig CSRF-token.'
'No authentication provider found to support the authentication token.': 'Ingen autentiseringsleverantör hittades som stöder autentiseringstoken.'
'No session available, it either timed out or cookies are not enabled.': 'Ingen session tillgänglig, den har antingen löpt ut eller så är cookies inaktiverade.'
'No token could be found.': 'Ingen token kunde hittas.'
'Username could not be found.': 'Användarnamnet kunde inte hittas.'
'Account has expired.': 'Kontot har löpt ut.'
'Credentials have expired.': 'Inloggningsuppgifterna har löpt ut.'
'Account is disabled.': 'Kontot är inaktiverat.'
'Account is locked.': 'Kontot är låst.'
'Too many failed login attempts, please try again later.': 'För många misslyckade inloggningsförsök, försök igen senare.'
'Invalid or expired login link.': 'Ogiltig eller utgången inlänkningslänk.'
'Too many failed login attempts, please try again in %minutes% minute.': 'För många misslyckade inloggningsförsök, försök igen om %minutes% minut.'
'Too many failed login attempts, please try again in %minutes% minutes.': 'För många misslyckade inloggningsförsök, försök igen om %minutes% minuter.'
