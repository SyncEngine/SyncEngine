onboarding.dashboard.welcome.title: 'Ласкаво просимо до SyncEngine'
onboarding.dashboard.welcome.body: |
  SyncEngine — це модульний рушій автоматизації та синхронізації даних. Він дозволяє створювати надійні, прозорі інтеграції між системами.

  Цей швидкий тур проведе вас крізь ключові частини інтерфейсу.

onboarding.dashboard.menu.title: 'Меню навігації'
onboarding.dashboard.menu.body: |
  Бічна панель — ваша основна навігація.

  Ви можете згорнути меню, щоб зосередитися на своєму контенті.

onboarding.dashboard.connections.title: "З'єднання"
onboarding.dashboard.connections.body: |
  З'єднання — це мости між SyncEngine та вашими зовнішніми системами. Вони керують автентифікацією, обліковими даними та безпечною передачею даних.

  Підтримувані типи включають HTTP (із різними методами автентифікації), SFTP/FTP, SQL-бази даних, SOAP-сервіси та локальну файлову систему. Кожне з'єднання можна повторно використовувати в кількох автоматизаціях.

onboarding.dashboard.automations.title: 'Автоматизації'
onboarding.dashboard.automations.body: |
  Автоматизації — це контейнери вищого рівня, які оркеструють ваші робочі процеси. Кожна автоматизація може містити кілька потоків і визначати, як вони запускаються: вручну, за графіком або за подіями.

  Автоматизації надають історію виконання (traces), щоб ви могли перевірити кожне виконання, побачити, які дані були оброблені та налагодити будь-які проблеми.

onboarding.dashboard.flows.title: 'Потоки'
onboarding.dashboard.flows.body: |
  Потоки визначають послідовність виконання в межах автоматизації. Кожен потік містить серію кроків, де кожен крок запускає Рутину.

  Дані течуть від однієї рутини до наступної, при цьому кожна рутина виконує конкретну функцію, таку як отримання даних, трансформація та відправка їх в іншу систему. Потоки виконуються послідовно за замовчуванням.

onboarding.dashboard.routines.title: 'Рутини'
onboarding.dashboard.routines.body: |
  Рутини — це повторно використовувані послідовності дій (Завдань), які виконують конкретну функцію.

  Кожна рутина є повторно використовуваною, модульною і може бути викликана одним або кількома Потоками, надаючи вам неймовірної гнучкості та ефективності.

onboarding.dashboard.storages.title: 'Сховища'
onboarding.dashboard.storages.body: |
  Сховища в SyncEngine — це безпечні, стійкі контейнери, що використовуються для зберігання структурованих даних, до яких можна отримати доступ у ваших автоматизаціях.
  Вони діють як ваша довготривала пам'ять, дозволяючи потокам і рутинам зберігати та отримувати інформацію між виконаннями.

  Сховища ідеально підходять для зберігання повторно використовуваних або спільних даних, значень конфігурації та результатів, до яких ви хочете отримати доступ пізніше, не покладаючись на зовнішні бази даних або API.

onboarding.dashboard.account.title: 'Обліковий запис'
onboarding.dashboard.account.body: |
  Розділ Обліковий запис надає доступ до вашого профілю користувача, налаштувань і токенів доступу.

onboarding.dashboard.modules.title: 'Модулі'
onboarding.dashboard.modules.body: |
  Модулі — це налаштовувані розширення, що додають нову функціональність до SyncEngine. Їх можна використовувати для інтеграції зі сторонніми сервісами, розширення основної функціональності або створення користувацьких інтеграцій.

onboarding.dashboard.system.title: 'Системний дашборд'
onboarding.dashboard.system.body: |
  Системний дашборд надає швидкий доступ до:

  • Налаштування параметрів SyncEngine
  • Управління секретами та чутливими значеннями у Vault
  • Моніторингу фонових працівників
  • Перегляду інформації про систему
  • тощо.

  Використовуйте ці інструменти для управління вашою установкою SyncEngine.

onboarding.dashboard.runtime_history.title: 'Історія виконання'
onboarding.dashboard.runtime_history.body: |
  Історія виконання надає детальний журнал усіх виконань автоматизації, дозволяючи відстежувати продуктивність, налагоджувати проблеми та аналізувати потоки даних.

onboarding.dashboard.summary.title: 'Ви готові!'
onboarding.dashboard.summary.body: |
  Тепер ви знаєте основні концепції SyncEngine:

  • З'єднання з'єднують ваші системи
  • Автоматизації оркеструють робочі процеси
  • Потоки визначають послідовності виконання
  • Рутини — це повторно використовувані послідовності дій
  • Завдання — це окремі дії
  • Сховища зберігають стійкі дані
  • Модулі додають нову функціональність

  Почніть зі створення З'єднання, а потім побудуйте свій перший Потік з Рутинами та Завданнями.

onboarding.dashboard.help.title: 'Знову потрібна допомога?'
onboarding.dashboard.help.body: |
  Ви можете запустити тур будь-коли, натиснувши на іконку знака питання на панелі інструментів (якщо доступна). Використовуйте її як швидку довідку, коли хочете дізнатися більше про інтерфейс або повторити будь-яку концепцію.

  Потрібна підтримка? Відвідайте docs.syncengine.io або створіть тикет на syncengine.io/support.
