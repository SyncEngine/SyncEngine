'The video width is too small ({{ width }}px). Minimum width expected is {{ min_width }}px.': '동영상 너비가 너무 작습니다({{ width }}px). 최소 너비는 {{ min_width }}px여야 합니다.'
'The video height is too big ({{ height }}px). Allowed maximum height is {{ max_height }}px.': '동영상 높이가 너무 큽니다({{ height }}px). 허용되는 최대 높이는 {{ max_height }}px입니다.'
'The video height is too small ({{ height }}px). Minimum height expected is {{ min_height }}px.': '동영상 높이가 너무 작습니다({{ height }}px). 최소 높이는 {{ min_height }}px여야 합니다.'
'The video has too few pixels ({{ pixels }} pixels). Minimum amount expected is {{ min_pixels }} pixels.': '동영상 픽셀이 너무 적습니다({{ pixels }}픽셀). 최소 픽셀 수는 {{ min_pixels }}픽셀이어야 합니다.'
'The video has too many pixels ({{ pixels }} pixels). Maximum amount expected is {{ max_pixels }} pixels.': '동영상 픽셀이 너무 많습니다({{ pixels }}픽셀). 최대 픽셀 수는 {{ max_pixels }}픽셀이어야 합니다.'
'The video ratio is too big ({{ ratio }}). Allowed maximum ratio is {{ max_ratio }}.': '동영상 비율이 너무 큽니다({{ ratio }}). 허용되는 최대 비율은 {{ max_ratio }}입니다.'
'The video ratio is too small ({{ ratio }}). Minimum ratio expected is {{ min_ratio }}.': '동영상 비율이 너무 작습니다({{ ratio }}). 최소 비율은 {{ min_ratio }}여야 합니다.'
'The video is square ({{ width }}x{{ height }}px). Square videos are not allowed.': '동영상이 정사각형입니다({{ width }}x{{ height }}px). 정사각형 동영상은 허용되지 않습니다.'
'The video is landscape oriented ({{ width }}x{{ height }}px). Landscape oriented videos are not allowed.': '동영상이 가로 방향입니다({{ width }}x{{ height }}px). 가로 방향 동영상은 허용되지 않습니다.'
'The video is portrait oriented ({{ width }}x{{ height }}px). Portrait oriented videos are not allowed.': '동영상이 세로 방향입니다({{ width }}x{{ height }}px). 세로 방향 동영상은 허용되지 않습니다.'
'The video file is corrupted.': '동영상 파일이 손상되었습니다.'
'The video contains multiple streams. Only one stream is allowed.': '동영상에 여러 스트림이 포함되어 있습니다. 하나의 스트림만 허용됩니다.'
'Unsupported video codec "{{ codec }}".': '지원되지 않는 동영상 코덱 "{{ codec }}".'
'Unsupported video container "{{ container }}".': '지원되지 않는 동영상 컨테이너 "{{ container }}".'
'The image file is corrupted.': '이미지 파일이 손상되었습니다.'
'The image has too few pixels ({{ pixels }} pixels). Minimum amount expected is {{ min_pixels }} pixels.': '이미지 픽셀이 너무 적습니다({{ pixels }}픽셀). 최소 픽셀 수는 {{ min_pixels }}픽셀이어야 합니다.'
'The image has too many pixels ({{ pixels }} pixels). Maximum amount expected is {{ max_pixels }} pixels.': '이미지 픽셀이 너무 많습니다({{ pixels }}픽셀). 최대 픽셀 수는 {{ max_pixels }}픽셀이어야 합니다.'
'This filename does not match the expected charset.': '이 파일 이름은 예상된 문자셋과 일치하지 않습니다.'
'This value is not valid XML.': '이 값은 유효한 XML이 아닙니다.'
