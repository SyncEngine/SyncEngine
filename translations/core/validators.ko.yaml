'This XML payload is too large ({{ size }} bytes): it exceeds the limit of {{ limit }} bytes.': '이 XML 페이로드가 너무 큽니다({{ size }}바이트). {{ limit }}바이트 제한을 초과합니다.'
'This value is not a valid cron expression.': '이 값은 유효한 cron 표현식이 아닙니다.'
'The referenced entity does not exist.': '참조된 엔티티가 존재하지 않습니다.'
'This is not a valid ULID.': '이 값은 유효한 ULID가 아닙니다.'
