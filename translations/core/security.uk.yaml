'An authentication exception occurred.': 'Виникла помилка автентифікації.'
'Authentication credentials could not be found.': 'Облікові дані автентифікації не знайдено.'
'Authentication request could not be processed due to a system problem.': 'Запит автентифікації не вдалося обробити через системну проблему.'
'Invalid credentials.': 'Недійсні облікові дані.'
'Cookie has already been used by someone else.': 'Файл cookie вже використовувався кимось іншим.'
'Not privileged to request the resource.': 'Недостатньо прав для запиту ресурсу.'
'Invalid CSRF token.': 'Недійсний CSRF-токен.'
'No authentication provider found to support the authentication token.': 'Не знайдено провайдера автентифікації, який би підтримував токен автентифікації.'
'No session available, it either timed out or cookies are not enabled.': 'Сесія недоступна, вона або закінчилася, або файли cookie вимкнено.'
'No token could be found.': 'Токен не знайдено.'
'Username could not be found.': "Ім'я користувача не знайдено."
'Account has expired.': 'Акаунт закінчився.'
'Credentials have expired.': 'Облікові дані закінчилися.'
'Account is disabled.': 'Акаунт вимкнено.'
'Account is locked.': 'Акаунт заблоковано.'
'Too many failed login attempts, please try again later.': 'Забагато невдалих спроб входу, спробуйте пізніше.'
'Invalid or expired login link.': 'Недійсне або прострочене посилання для входу.'
'Too many failed login attempts, please try again in %minutes% minute.': 'Забагато невдалих спроб входу, спробуйте знову через %minutes% хвилину.'
'Too many failed login attempts, please try again in %minutes% minutes.': 'Забагато невдалих спроб входу, спробуйте знову через %minutes% хвилин.'
