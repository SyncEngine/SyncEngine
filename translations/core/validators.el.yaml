'The video height is too small ({{ height }}px). Minimum height expected is {{ min_height }}px.': 'Το ύψος του βίντεο είναι πολύ μικρό ({{ height }}px). Το αναμενόμενο ελάχιστο ύψος είναι {{ min_height }}px.'
'The video has too few pixels ({{ pixels }} pixels). Minimum amount expected is {{ min_pixels }} pixels.': 'Το βίντεο έχει πολύ λίγα εικονοστοιχεία ({{ pixels }} εικονοστοιχεία). Το αναμενόμενο ελάχιστο είναι {{ min_pixels }} εικονοστοιχεία.'
'The video has too many pixels ({{ pixels }} pixels). Maximum amount expected is {{ max_pixels }} pixels.': 'Το βίντεο έχει πολλά εικονοστοιχεία ({{ pixels }} εικονοστοιχεία). Το αναμενόμενο μέγιστο είναι {{ max_pixels }} εικονοστοιχεία.'
'The video ratio is too big ({{ ratio }}). Allowed maximum ratio is {{ max_ratio }}.': 'Η αναλογία βίντεο είναι πολύ μεγάλη ({{ ratio }}). Η επιτρεπόμενη μέγιστη αναλογία είναι {{ max_ratio }}.'
'The video ratio is too small ({{ ratio }}). Minimum ratio expected is {{ min_ratio }}.': 'Η αναλογία βίντεο είναι πολύ μικρή ({{ ratio }}). Η αναμενόμενη ελάχιστη αναλογία είναι {{ min_ratio }}.'
'The video is square ({{ width }}x{{ height }}px). Square videos are not allowed.': 'Το βίντεο είναι τετράγωνο ({{ width }}x{{ height }}px). Τα τετράγωνα βίντεο δεν επιτρέπονται.'
'The video is landscape oriented ({{ width }}x{{ height }}px). Landscape oriented videos are not allowed.': 'Το βίντεο είναι οριζόντιο ({{ width }}x{{ height }}px). Τα οριζόντια βίντεο δεν επιτρέπονται.'
'The video is portrait oriented ({{ width }}x{{ height }}px). Portrait oriented videos are not allowed.': 'Το βίντεο είναι κάθετο ({{ width }}x{{ height }}px). Τα κάθετα βίντεο δεν επιτρέπονται.'
'The video file is corrupted.': 'Το αρχείο βίντεο είναι κατεστραμμένο.'
'The video contains multiple streams. Only one stream is allowed.': 'Το βίντεο περιέχει πολλαπλά ρεύματα. Μόνο ένα ρεύμα επιτρέπεται.'
'Unsupported video codec "{{ codec }}"': 'Μη υποστηριζόμενο κωδικοποιητικό βίντεο "{{ codec }}".'
'Unsupported video container "{{ container }}"': 'Μη υποστηριζόμενος φορέας βίντεο "{{ container }}".'
'The image file is corrupted.': 'Το αρχείο εικόνας είναι κατεστραμμένο.'
'The image has too few pixels ({{ pixels }} pixels). Minimum amount expected is {{ min_pixels }} pixels.': 'Η εικόνα έχει πολύ λίγα εικονοστοιχεία ({{ pixels }} εικονοστοιχεία). Το αναμενόμενο ελάχιστο είναι {{ min_pixels }} εικονοστοιχεία.'
'The image has too many pixels ({{ pixels }} pixels). Maximum amount expected is {{ max_pixels }} pixels.': 'Η εικόνα έχει πολλά εικονοστοιχεία ({{ pixels }} εικονοστοιχεία). Το αναμενόμενο μέγιστο είναι {{ max_pixels }} εικονοστοιχεία.'
'This filename does not match the expected charset.': 'Αυτό το όνομα αρχείου δεν ταιριάζει με την αναμενόμενη κωδικοποίηση.'
'This value is not valid XML.': 'Αυτή η τιμή δεν είναι έγκυρο XML.'
'This value does not conform to the expected XSD schema.': 'Αυτή η τιμή δεν συμμορφώνεται με το αναμενόμενο σχήμα XSD.'
'This XML payload is too large ({{ size }} bytes): it exceeds the limit of {{ limit }} bytes.': 'Αυτό το φορτίο XML είναι πολύ μεγάλο ({{ size }} bytes): υπερβαίνει το όριο των {{ limit }} bytes.'
'This value is not a valid cron expression.': 'Αυτή η τιμή δεν είναι έγκυρη έκφραση cron.'
