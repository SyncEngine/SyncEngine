onboarding.dashboard.welcome.title: 'Witamy w SyncEngine'
onboarding.dashboard.welcome.body: |
  SyncEngine to modułowy silnik automatyzacji i synchronizacji danych. Pozwala budować niezawodne, przejrzyste integracje między systemami.

  Ten szybki przewodnik poprowadzi Cię przez kluczowe części interfejsu.

onboarding.dashboard.menu.title: 'Menu Nawigacyjne'
onboarding.dashboard.menu.body: |
  Pasek boczny to Twoja główna nawogacja.

  Możesz zwinąć menu, aby skupić się na swojej zawartości.

onboarding.dashboard.connections.title: 'Połączenia'
onboarding.dashboard.connections.body: |
  Połączenia to mosty między SyncEngine a Twoimi systemami zewnętrznymi. Zarządzają autoryzacją, poświadczeniami i bezpieczną transmisją danych.

  Obsługiwane typy obejmują HTTP (z różnymi metodami uwierzytelniania), SFTP/FTP, bazy danych SQL, usługi SOAP i lokalny system plików. Każde połączenie może być ponownie wykorzystane w wielu automatyzacjach.

onboarding.dashboard.automations.title: 'Automatyzacje'
onboarding.dashboard.automations.body: |
  Automatyzacje to kontenery najwyższego poziomu, które orchestrują Twoje przepływy pracy. Każda automatyzacja może zawierać wiele przepływów i definiować, jak są uruchamiane: ręcznie, zgodnie z harmonogramem lub przez zdarzenia.

  Automatyzacje zapewniają historię wykonania (traces), abyś mógł zinspectować każde wykonanie, zobaczyć jakie dane zostały przetworzone i debugować wszelkie problemy.

onboarding.dashboard.flows.title: 'Przepływy'
onboarding.dashboard.flows.body: |
  Przepływy definiują sekwencję wykonania w ramach automatyzacji. Każdy przepływ zawiera serię kroków, gdzie każdy krok uruchamia Rutynę.

  Dane płyną z jednej rutyny do następnej, przy czym każda rutyna wykonuje określoną funkcję, taką jak pobieranie danych, transformacja i wysyłanie ich do innego systemu. Przepływy wykonują się sekwencyjnie domyślnie.

onboarding.dashboard.routines.title: 'Rutyny'
onboarding.dashboard.routines.body: |
  Rutyny to ponownie wykorzystywane sekwencje akcji (Zadań), które wykonują określoną funkcję.

  Każda rutyna jest ponownie wykorzystywana, modułowa i może być wywoływana przez jedną lub więcej Przepływy, dając Ci niesamowitą elastyczność i wydajność.

onboarding.dashboard.storages.title: 'Magazyny'
onboarding.dashboard.storages.body: |
  Magazyny w SyncEngine to bezpieczne, trwałe kontenery używane do przechowywania strukturyzowanych danych, które mogą być dostępne w ramach Twoich automatyzacji.
  Działają jako Twoja pamięć długoterminowa, pozwalając przepływom i rutynom zapisywać i pobierać informacje między wykonaniami.

  Magazyny są idealne do przechowywania ponownie wykorzystywanych lub współdzielonych danych, wartości konfiguracji i wyników, do których chcesz uzyskać dostęp później, bez polegania na zewnętrznych bazach danych lub API.

onboarding.dashboard.account.title: 'Konto'
onboarding.dashboard.account.body: |
  Sekcja Konto zapewnia dostęp do Twojego profilu użytkownika, ustawień i tokenów dostępu.

onboarding.dashboard.modules.title: 'Moduły'
onboarding.dashboard.modules.body: |
  Moduły to konfigurowalne rozszerzenia dodające nową funkcjonalność do SyncEngine. Mogą być używane do integracji z usługami zewnętrznych firm, rozszerzania podstawowej funkcjonalności lub tworzenia niestandardowych integracji.

onboarding.dashboard.system.title: 'Panel Systemowy'
onboarding.dashboard.system.body: |
  Panel systemowy daje szybki dostęp do:

  • Konfiguracji ustawień SyncEngine
  • Zarządzania sekretami i wrażliwymi wartościami w Vault
  • Monitorowania pracowników w tle
  • Wyświetlania informacji o systemie
  • itp.

  Użyj tych narzędzi do zarządzania swoją instalacją SyncEngine.

onboarding.dashboard.runtime_history.title: 'Historia Wykonania'
onboarding.dashboard.runtime_history.body: |
  Historia wykonania zapewnia szczegółowy dziennik wszystkich wykonanych automatyzacji, pozwalając na śledzenie wydajności, debugowanie problemów i analizę przepływów danych.

onboarding.dashboard.summary.title: 'Jesteś gotowy!'
onboarding.dashboard.summary.body: |
  Teraz znasz główne koncepcje SyncEngine:

  • Połączenia łączą Twoje systemy
  • Automatyzacje orchestrują przepływy pracy
  • Przepływy definiują sekwencje wykonania
  • Rutyny to ponownie wykorzystywane sekwencje akcji
  • Zadania to pojedyncze akcje
  • Magazyny przechowują trwałe dane
  • Moduły dodają nową funkcjonalność

  Zacznij od utworzenia Połączenia, a następnie zbuduj swój pierwszy Przepływ z Rutynami i Zadaniami.

onboarding.dashboard.help.title: 'Potrzebujesz ponownie pomocy?'
onboarding.dashboard.help.body: |
  Możesz uruchomić wycieczkę w dowolnym momencie klikając ikonę znaku zapytania na pasku narzędzi (jeśli dostępna). Używaj jej jako szybkiej referencji, gdy chcesz dowiedzieć się więcej o interfejsie lub przypomnieć sobie jakąś koncepcję.

  Potrzebujesz wsparcia? Odwiedź docs.syncengine.io lub utwórz ticket na syncengine.io/support.
