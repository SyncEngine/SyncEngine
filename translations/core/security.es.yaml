'Authentication credentials could not be found.': 'No se pudieron encontrar las credenciales de autenticación.'
'Authentication request could not be processed due to a system problem.': 'La solicitud de autenticación no pudo procesarse debido a un problema del sistema.'
'Invalid credentials.': 'Credenciales no válidas.'
'Cookie has already been used by someone else.': 'La cookie ya ha sido utilizada por otra persona.'
