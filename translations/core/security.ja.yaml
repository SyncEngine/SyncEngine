'An authentication exception occurred.': '認証例外が発生しました。'
'Authentication credentials could not be found.': '認証情報が見つかりませんでした。'
'Authentication request could not be processed due to a system problem.': 'システムの問題により、認証リクエストを処理できませんでした。'
'Invalid credentials.': '認証情報が無効です。'
'Cookie has already been used by someone else.': 'Cookieはすでに他のユーザーによって使用されています。'
'Not privileged to request the resource.': 'リソースをリクエストする権限がありません。'
'Invalid CSRF token.': 'CSRFトークンが無効です。'
'No authentication provider found to support the authentication token.': '認証トークンをサポートする認証プロバイダーが見つかりません。'
'No session available, it either timed out or cookies are not enabled.': 'セッションが利用できません。タイムアウトしたか、Cookieが有効になっていません。'
'No token could be found.': 'トークンが見つかりませんでした。'
'Username could not be found.': 'ユーザー名が見つかりませんでした。'
'Account has expired.': 'アカウントの有効期限が切れています。'
'Credentials have expired.': '認証情報の有効期限が切れています。'
'Account is disabled.': 'アカウントが無効になっています。'
'Account is locked.': 'アカウントがロックされています。'
'Too many failed login attempts, please try again later.': 'ログイン試行が多すぎます。後でもう一度お試しください。'
'Invalid or expired login link.': 'ログインリンクが無効または期限切れです。'
'Too many failed login attempts, please try again in %minutes% minute.': 'ログイン試行が多すぎます。%minutes% 分後にもう一度お試しください。'
'Too many failed login attempts, please try again in %minutes% minutes.': 'ログイン試行が多すぎます。%minutes% 分後にもう一度お試しください。'
