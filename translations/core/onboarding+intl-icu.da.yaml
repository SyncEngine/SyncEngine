# Onboarding tour: welcome sequence

# Welcome step (modal)
onboarding.dashboard.welcome.title: 'Velkommen til SyncEngine'
onboarding.dashboard.welcome.body: |
  SyncEngine er en modulær automatiserings- og datasynkroniseringsmotor. Med den kan du bygge pålidelige, transparente integrationer mellem systemer.

  Denne hurtige rundvisning fører dig gennem de vigtigste dele af grænsefladen.

# Navigation Menu step (popover)
onboarding.dashboard.menu.title: 'Navigationsmenu'
onboarding.dashboard.menu.body: |
  Sidepanelet er din primære navigation.

  Du kan skjule menuen for at fokusere på dit indhold.

# Connections step (popover)
onboarding.dashboard.connections.title: 'Forbindelser'
onboarding.dashboard.connections.body: |
  Forbindelser er broerne mellem SyncEngine og dine eksterne systemer. De håndterer godkendelse, legitimationsoplysninger og sikker dataoverførsel.

  Understøttede typer omfatter HTTP (med forskellige godkendelsesmetoder), SFTP/FTP, SQL-databaser, SOAP-tjenester og det lokale filsystem. Hver forbindelse kan genbruges på tværs af flere automatiseringer.

# Automations step (popover)
onboarding.dashboard.automations.title: 'Automatiseringer'
onboarding.dashboard.automations.body: |
  Automatiseringer er de øverste containere, der orkestrerer dine arbejdsgange. Hver automatisering kan indeholde flere flyt og definere, hvordan de udløses: manuelt, efter en tidsplan eller via hændelser.

  Automatiseringer giver udførelseshistorik (forløb), så du kan inspicere hver kørsel, se, hvilke data der blev behandlet, og fejlsøge eventuelle problemer.

# Flows step (popover)
onboarding.dashboard.flows.title: 'Flyt'
onboarding.dashboard.flows.body: |
  Flyt definerer eksekveringssekvensen i en automatisering. Hvert flyt indeholder en serie trin, hvor hvert trin udløser en rutine.

  Data flyder fra én rutine til den næste, hvor hver rutine udfører en bestemt funktion, f.eks. at hente data, transformere dem og sende dem til et andet system. Flyt eksekveres som standard i sekvens.

# Routines step (popover)
onboarding.dashboard.routines.title: 'Rutiner'
onboarding.dashboard.routines.body: |
  Rutiner er genanvendelige sekvenser af handlinger (opgaver), der udfører en bestemt funktion.

  Hver rutine er genanvendelig, modulær og kan kaldes af et eller flere flyt, hvilket giver dig fantastisk fleksibilitet og effektivitet.

# Storages step (popover)
onboarding.dashboard.storages.title: 'Lagre'
onboarding.dashboard.storages.body: |
  Lagre i SyncEngine er sikre, persistente containere, der bruges til at opbevare strukturerede data, som kan tilgås på tværs af dine automatiseringer.
  De fungerer som din langtidshukommelse og giver flyt og rutiner mulighed for at gemme og hente oplysninger mellem kørsler.

  Lagre er ideelle til at gemme genanvendelige eller delte data, konfigurationsværdier og resultater, du ønsker at tilgå senere, uden at skulle stole på eksterne databaser eller API'er.

# Account step (popover)
onboarding.dashboard.account.title: 'Konto'
onboarding.dashboard.account.body: |
  Kontosektionen giver adgang til din brugerprofil, dine indstillinger og dine adgangstokens.

# Modules step (popover)
onboarding.dashboard.modules.title: 'Moduler'
onboarding.dashboard.modules.body: |
  Moduler er tilpasselige udvidelser, der tilføjer ny funktionalitet til SyncEngine. De kan bruges til at integrere med tredjepartstjenester, udvide kernens funktionalitet eller oprette brugerdefinerede integrationer.

onboarding.dashboard.system.title: 'Systemdashboard'
onboarding.dashboard.system.body: |
  Systemdashboardet giver dig hurtig adgang til:

  • Konfigurere SyncEngine-indstillinger
  • Administrere Secrets og følsomme værdier i Vault
  • Overvåge baggrundsarbejdere
  • Se systemoplysninger
  • osv.

  Brug disse værktøjer til at administrere din SyncEngine-installation.

# Runtime History step (popover)
onboarding.dashboard.runtime_history.title: 'Kørselshistorik'
onboarding.dashboard.runtime_history.body: |
  Kørselshistorik giver en detaljeret log over alle automatiseringseksekveringer, så du kan spore ydeevne, fejlsøge problemer og analysere dataflyt.

# Summary step (modal)
onboarding.dashboard.summary.title: 'Du er klar!'
onboarding.dashboard.summary.body: |
  Du kender nu kernens koncepter i SyncEngine:

  • Forbindelser kobler dine systemer sammen
  • Automatiseringer orkestrerer arbejdsgange
  • Flyt definerer eksekveringssekvenser
  • Rutiner er genanvendelige sekvenser af handlinger
  • Opgaver er de enkelte handlinger
  • Lagre gemmer persistente data
  • Moduler tilføjer ny funktionalitet

  Start med at oprette en forbindelse, og byg derefter dit første flyt med rutiner og opgaver.

# Help icon step (popover)
onboarding.dashboard.help.title: 'Har du brug for hjælp igen?'
onboarding.dashboard.help.body: |
  Du kan starte rundvisningen når som helst ved at klikke på spørgsmålstegnsikonet på værktøjslinjen (hvis det er tilgængeligt). Brug det som hurtig reference, når du vil lære mere om grænsefladen eller gense et koncept.

  Har du brug for support? Besøg docs.syncengine.io, eller opret en sag på syncengine.io/support.
