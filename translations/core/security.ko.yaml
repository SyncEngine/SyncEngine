'An authentication exception occurred.': '인증 예외가 발생했습니다.'
'Authentication credentials could not be found.': '인증 자격 증명을 찾을 수 없습니다.'
'Authentication request could not be processed due to a system problem.': '시스템 문제로 인증 요청을 처리할 수 없습니다.'
'Invalid credentials.': '자격 증명이 유효하지 않습니다.'
'Cookie has already been used by someone else.': '쿠키가 이미 다른 사용자에 의해 사용되었습니다.'
'Not privileged to request the resource.': '리소스를 요청할 권한이 없습니다.'
'Invalid CSRF token.': 'CSRF 토큰이 유효하지 않습니다.'
'No authentication provider found to support the authentication token.': '인증 토큰을 지원하는 인증 제공자를 찾을 수 없습니다.'
'No session available, it either timed out or cookies are not enabled.': '세션을 사용할 수 없습니다. 세션이 만료되었거나 쿠키가 활성화되어 있지 않습니다.'
'No token could be found.': '토큰을 찾을 수 없습니다.'
'Username could not be found.': '사용자 이름을 찾을 수 없습니다.'
'Account has expired.': '계정이 만료되었습니다.'
'Credentials have expired.': '자격 증명이 만료되었습니다.'
'Account is disabled.': '계정이 비활성화되었습니다.'
'Account is locked.': '계정이 잠겼습니다.'
'Too many failed login attempts, please try again later.': '로그인 시도가 너무 많이 실패했습니다. 나중에 다시 시도해 주세요.'
'Invalid or expired login link.': '로그인 링크가 유효하지 않거나 만료되었습니다.'
'Too many failed login attempts, please try again in %minutes% minute.': '로그인 시도가 너무 많이 실패했습니다. %minutes%분 후에 다시 시도해 주세요.'
'Too many failed login attempts, please try again in %minutes% minutes.': '로그인 시도가 너무 많이 실패했습니다. %minutes%분 후에 다시 시도해 주세요.'
