'As collection': 'Як колекція'
'Always returns results as a collection, even if only one line is decoded.': 'Завжди повертає результати як колекцію, навіть якщо декодується лише один рядок.'
'Output UTF8 Bom key': 'Ключ виводу UTF8 BOM'
File: Файл
