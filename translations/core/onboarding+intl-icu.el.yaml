onboarding.dashboard.welcome.title: 'Καλώς ήρθατε στο SyncEngine'
onboarding.dashboard.welcome.body: |
  Το SyncEngine είναι ένας μοναδικός μηχανισμός αυτοματοποίησης και συγχρονισμού δεδομένων. Σας επιτρέπει να δημιουργήσετε αξιόπιστες, διαφανείς ενσωματώσεις μεταξύ συστημάτων.

  Αυτή η γρήγορη ξενάγηση θα σας καθοδηγήσει στα κύρια μέρη της διεπαφής.

onboarding.dashboard.menu.title: 'Μενού Πλοήγησης'
onboarding.dashboard.menu.body: |
  Η πλευρική γραμμή είναι η κύρια πλοήγησή σας.

  Μπορείτε να συρρικνώσετε το μενού για να εστιάσετε στο περιεχόμενό σας.

onboarding.dashboard.connections.title: 'Συνδέσεις'
onboarding.dashboard.connections.body: |
  Οι συνδέσεις είναι οι γέφυρες μεταξύ του SyncEngine και των εξωτερικών σας συστημάτων. Διαχειρίζονται την ταυτοποίηση, διαπιστευτήρια και ασφαλή μεταφορά δεδομένων.

  Οι υποστηριζόμενοι τύποι περιλαμβάνουν HTTP (με διάφορες μεθόδους ταυτοποίησης), SFTP/FTP, SQL βάσεις δεδομένων, υπηρεσίες SOAP και το τοπικό αρχείο σύστημα. Κάθε σύνδεση μπορεί να επαναχρησιμοποιηθεί σε πολλαπλές αυτοματοποιήσεις.

onboarding.dashboard.automations.title: 'Αυτοματοποιήσεις'
onboarding.dashboard.automations.body: |
  Οι αυτοματοποιήσεις είναι οι δοχείες ανώτερου επιπέδου που orchestrate τα workflow σας. Κάθε αυτοματοποίηση μπορεί να περιέχει πολλαπλά ροές και να ορίζει πώς ενεργοποιούνται: χειροκίνητα, σε πρόγραμμα ή από γεγονότα.

  Οι αυτοματοποιήσεις παρέχουν ιστορικό εκτέλεσης (traces) ώστε να μπορείτε να επιθεωρήσετε κάθε εκτέλεση, να δείτε ποια δεδομένα επεξεργάστηκαν και να απολαύσετε τυχόν προβλήματα.

onboarding.dashboard.flows.title: 'Ροές'
onboarding.dashboard.flows.body: |
  Οι ροές ορίζουν τη σειρά εκτέλεσης εντός μιας αυτοματοποίησης. Κάθε ροή περιέχει μια σειρά βημάτων, όπου κάθε βήμα ενεργοποιεί μια Ρουτίνα.

  Τα δεδομένα ρέουν από μια ρουτίνα στην επόμενη, με κάθε ρουτίνα να εκτελεί μια συγκεκριμένη λειτουργία, όπως η ανάκτηση δεδομένων, ο μετασχηματισμός τους και η αποστολή τους σε ένα άλλο σύστημα. Οι ροές εκτελούνται με σειρά από προεπιλογή.

onboarding.dashboard.routines.title: 'Ρουτίνες'
onboarding.dashboard.routines.body: |
  Οι ρουτίνες είναι επαναχρησιμοποιήσιμες ακολουθίες ενεργειών (Εργασίες) που εκτελούν μια συγκεκριμένη λειτουργία.

  Κάθε ρουτίνα είναι επαναχρησιμοποιήσιμη, μοναδική και μπορεί να καλεστεί από μία ή περισσότερες Ροές, δίνοντάς σας απίστευτη ευελιξία και αποδοτικότητα.

onboarding.dashboard.storages.title: 'Αποθηκεύσεις'
onboarding.dashboard.storages.body: |
  Οι αποθηκεύσεις στο SyncEngine είναι ασφαλείς, μόνιμες δοχείο χρησιμοποιούνται για να κρατήσουν δομημένα δεδομένα που μπορούν να προσβληθούν από τις αυτοματοποιήσεις σας.
  Δρουν ως η μακροπρόθεσμη μνήμη σας, επιτρέποντας στις ροές και τις ρουτίνες να αποθηκεύουν και να ανακτούν πληροφορίες μεταξύ εκτελέσεων.

  Οι αποθηκεύσεις είναι ιδανικές για την αποθήκευση επαναχρησιμοποιήσιμων ή κοινοποιημένων δεδομένων, τιμών διαμόρφωσης και αποτελεσμάτων που θέλετε να προσβληθούν αργότερα, χωρίς να βασίζεστε σε εξωτερικές βάσεις δεδομένων ή API.

onboarding.dashboard.account.title: 'Λογαριασμός'
onboarding.dashboard.account.body: |
  Η ενότητα Λογαριασμός παρέχει πρόσβαση στο προφίλ χρήστη, τις ρυθμίσεις και τα διαπιστευτήρια πρόσβασης.

onboarding.dashboard.modules.title: 'Μονάδες'
onboarding.dashboard.modules.body: |
  Οι μονάδες είναι προσαρμόσιμες επεκτάσεις που προσθέτουν νέα λειτουργικότητα στο SyncEngine. Μπορούν να χρησιμοποιηθούν για ενσωμάτωση με υπηρεσίες τρίτων, επέκταση της βασικής λειτουργικότητας ή δημιουργία προσαρμοσμένων ενσωματώσεων.

onboarding.dashboard.system.title: 'Πίνακας Ελέγχου Συστήματος'
onboarding.dashboard.system.body: |
  Ο πίνακας ελέγχου του συστήματος σας δίνει γρήγορη πρόσβαση σε:

  • Διαμόρφωση ρυθμίσεων SyncEngine
  • Διαχείριση μυστικών και ευαίσθητων τιμών στο Vault
  • Παρακολούθηση εργαζομένων παρασκηνίου
  • Προβολή πληροφοριών συστήματος
  • κ.λπ.

  Χρησιμοποιήστε αυτά τα εργαλεία για να διαχειριστείτε την εγκατάσταση SyncEngine.

onboarding.dashboard.runtime_history.title: 'Ιστορικό Εκτέλεσης'
onboarding.dashboard.runtime_history.body: |
  Το ιστορικό εκτέλεσης παρέχει μια λεπτομερή καταγραφή όλων των εκτελέσεων αυτοματοποίησης, επιτρέποντάς σας να παρακολουθήσετε την απόδοση, να απολαύσετε προβλήματα και να αναλύσετε ροές δεδομένων.

onboarding.dashboard.summary.title: 'Είστε έτοιμοι!'
onboarding.dashboard.summary.body: |
  Τώρα γνωρίζετε τις βασικές έννοιες του SyncEngine:

  • Οι συνδέσεις γεφυρώνουν τα συστήματά σας
  • Οι αυτοματοποιήσεις orchestrate workflow
  • Οι ροές ορίζουν ακολουθίες εκτέλεσης
  • Οι ρουτίνες είναι επαναχρησιμοποιήσιμες ακολουθίες ενεργειών
  • Οι εργασίες είναι οι μεμονωμένες ενέργειες
  • Οι αποθηκεύσεις κρατούν μόνιμα δεδομένα
  • Οι μονάδες προσθέτουν νέα λειτουργικότητα

  Ξεκινήστε δημιουργώντας μια Σύνδεση, στη συνέχεια χτίστε την πρώτη σας Ροή με Ρουτίνες και Εργασίες.

onboarding.dashboard.help.title: 'Χρειάζεστε ξανά βοήθεια;'
onboarding.dashboard.help.body: |
  Μπορείτε να ενεργοποιήσετε την ξενάγηση οποιαδήποτε στιγμή πατώντας το εικονίδιο ερωτηματικού στη γραμμή εργαλείων (αν υπάρχει). Χρησιμοποιήστε το ως γρήγορη αναφορά κάθε φορά που θέλετε να μάθετε περισσότερα για τη διεπαφή ή να επανεξετάσετε οποιαδήποτε έννοια.

  Χρειάζεστε υποστήριξη; Επισκεφθείτε το docs.syncengine.io ή δημιουργήστε ένα ticket στο syncengine.io/support.
