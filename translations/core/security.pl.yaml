'An authentication exception occurred.': 'Wystąpił wyjątek uwierzytelniania.'
'Authentication credentials could not be found.': 'Nie można znaleźć danych uwierzytelniających.'
'Authentication request could not be processed due to a system problem.': 'Żądanie uwierzytelnienia nie mogło zostać przetworzone z powodu problemu systemowego.'
'Invalid credentials.': 'Nieprawidłowe dane uwierzytelniające.'
'Cookie has already been used by someone else.': 'Ciasteczko zostało już użyte przez kogoś innego.'
'Not privileged to request the resource.': 'Brak uprawnień do żądania zasobu.'
'Invalid CSRF token.': 'Nieprawidłowy token CSRF.'
'No authentication provider found to support the authentication token.': 'Nie znaleziono dostawcy uwierzytelniania obsługującego token uwierzytelniania.'
'No session available, it either timed out or cookies are not enabled.': 'Brak dostępnej sesji, either wygasła lub ciasteczka nie są włączone.'
'No token could be found.': 'Nie można znaleźć tokenu.'
'Username could not be found.': 'Nazwa użytkownika nie została znaleziona.'
'Account has expired.': 'Konto wygasło.'
'Credentials have expired.': 'Dane uwierzytelniające wygasły.'
'Account is disabled.': 'Konto jest wyłączone.'
'Account is locked.': 'Konto jest zablokowane.'
'Too many failed login attempts, please try again later.': 'Zbyt wiele nieudanych prób logowania, spróbuj ponownie później.'
'Invalid or expired login link.': 'Nieprawidłowy lub wygasły link logowania.'
'Too many failed login attempts, please try again in %minutes% minute.': 'Zbyt wiele nieudanych prób logowania, spróbuj ponownie za %minutes% minutę.'
'Too many failed login attempts, please try again in %minutes% minutes.': 'Zbyt wiele nieudanych prób logowania, spróbuj ponownie za %minutes% minuty.'
