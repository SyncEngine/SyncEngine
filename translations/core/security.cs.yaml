'An authentication exception occurred.': 'Došlo k výjimce ověřování.'
'Authentication credentials could not be found.': 'Ověřovací údaje se nepodařilo najít.'
'Authentication request could not be processed due to a system problem.': 'Požadavek na ověření nebylo možné zpracovat kvůli systémové chybě.'
'Invalid credentials.': 'Neplatné přihlašovací údaje.'
'Cookie has already been used by someone else.': 'Soubor cookie již byl použit někým jiným.'
'Not privileged to request the resource.': 'Nemáte oprávnění požadovat zdroj.'
'Invalid CSRF token.': 'Neplatný CSRF token.'
'No authentication provider found to support the authentication token.': 'Nebyl nalezen žádný poskytovatel ověřování podporující ověřovací token.'
'No session available, it either timed out or cookies are not enabled.': 'Není dostupná žádná relace, vypršela nebo nejsou povoleny soubory cookie.'
'No token could be found.': 'Token nebylo možné najít.'
'Username could not be found.': 'Uživatelské jméno nebylo nalezeno.'
'Account has expired.': 'Účet vypršel.'
'Credentials have expired.': 'Přihlašovací údaje vypršely.'
'Account is disabled.': 'Účet je zakázán.'
'Account is locked.': 'Účet je uzamčen.'
'Too many failed login attempts, please try again later.': 'Příliš mnoho neúspěšných pokusů o přihlášení, zkuste to prosím později.'
'Invalid or expired login link.': 'Neplatný nebo vypršený odkaz na přihlášení.'
'Too many failed login attempts, please try again in %minutes% minute.': 'Příliš mnoho neúspěšných pokusů o přihlášení, zkuste to prosím za %minutes% minutu.'
'Too many failed login attempts, please try again in %minutes% minutes.': 'Příliš mnoho neúspěšných pokusů o přihlášení, zkuste to prosím za %minutes% minuty.'
